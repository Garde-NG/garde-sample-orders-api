openapi: 3.0.3
info:
  title: Example Payments API
  version: 1.0.0
  description: Example Payments API (v1). A fictional provider used to exercise AutoAPI; the code in src/payments.js integrates against it.
servers:
  - url: https://api.example-payments.test/v1
security:
  - bearerAuth: []
paths:
  /payments:
    get:
      operationId: listPayments
      summary: List payments
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, succeeded, failed]
      responses:
        "200":
          description: A page of payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
    post:
      operationId: createPayment
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Retrieve a payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/{paymentId}/capture:
    post:
      operationId: capturePayment
      summary: Capture an authorized payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /refunds/{refundId}:
    get:
      operationId: getRefund
      summary: Retrieve a refund
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    PaymentCreate:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Amount in minor units
        currency:
          type: string
          enum: [USD, EUR, GBP]
        description:
          type: string
    Payment:
      type: object
      required: [id, amount, currency, status, created_at]
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed]
        created_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        fee:
          type: integer
    PaymentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        has_more:
          type: boolean
    Refund:
      type: object
      required: [id, payment_id, amount, status]
      properties:
        id:
          type: string
        payment_id:
          type: string
        amount:
          type: integer
        status:
          type: string
